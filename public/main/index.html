<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VendU — sell your stuff, book a service, get paid.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/main/vendu-shared.css">
<link rel="manifest" href="/main/manifest.webmanifest">
<meta name="theme-color" content="#5A2BE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<script src="/main/vendu-api.js"></script>
<script src="/main/vendu-tour.js"></script>
<style>
  :root{--paper:#FBF8F3;--ink:#1C1526;--mist:#6B6478;--line:#E7E0D6;--violet:#5A2BE0;--violet-soft:#EFE8FF;--amber:#FFB020;--rose:#FF5C8A;--green:#0E9F6E;--card:#FFFFFF;--school-a:#1D3A8A;--school-b:#F5C518;--shadow:0 6px 24px rgba(28,21,38,.08);--shadow-lg:0 14px 40px rgba(28,21,38,.16)}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#EDE7DD;color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;justify-content:center;min-height:100vh}
  .device{position:relative;width:100%;max-width:420px;height:100dvh;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg)}
  @supports not (height:100dvh){.device{height:100vh}}
  @media(min-width:440px){body{align-items:center;padding:24px 0}.device{height:860px;max-height:92vh;border-radius:38px;border:10px solid #14101c}}
  .screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:96px;scroll-behavior:smooth}
  .screen::-webkit-scrollbar{display:none}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(251,248,243,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:22px 20px 10px}
  .brandrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .wordmark{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1;display:flex;align-items:baseline;gap:1px;cursor:pointer}
  .wordmark .u{position:relative;color:var(--violet)}
  .gradcap{position:absolute;left:50%;top:-15px;transform:translateX(-50%);width:36px;height:auto;pointer-events:none;overflow:visible}
  .gradcap .tassel{transform-box:view-box;transform-origin:20px 9.5px}
  .wordmark.go .tassel{animation:gradturn 2.4s cubic-bezier(.45,.05,.55,.95)}
  .locpill{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:7px 12px;border-radius:100px;cursor:pointer}
  .locpill .dot{width:6px;height:6px;border-radius:50%;background:var(--amber)}
  .search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
  .search svg{flex:none}
  .search input{border:0;outline:0;font-size:15px;font-family:inherit;width:100%;color:var(--ink);background:transparent}
  .search input::placeholder{color:#A69FB0}
  /* cascading school watermark */
  .campus-wrap{position:relative;overflow:hidden}
  .campus-bg{position:absolute;top:-70px;left:-50px;right:-50px;bottom:-70px;z-index:0;pointer-events:none;overflow:hidden;color:var(--school-a);opacity:.08;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;line-height:2.5;letter-spacing:.03em;transform:rotate(-6deg);word-break:keep-all;user-select:none}
  .campus-content{position:relative;z-index:1;padding-top:12px}
  .seg{display:flex;gap:6px;background:rgba(239,234,225,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px;padding:4px;margin:0 20px}
  .seg div{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--mist);cursor:pointer;transition:.15s}
  .seg div.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .founder{margin:14px 20px 0;background:linear-gradient(100deg,rgba(90,43,224,.86),rgba(138,91,240,.86));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:#fff;border-radius:16px;padding:13px 15px;font-size:13px;line-height:1.35;box-shadow:0 8px 22px rgba(90,43,224,.25);display:flex;gap:11px;align-items:center}
  .founder .em{font-size:20px}.founder b{font-family:'Bricolage Grotesque',sans-serif;font-weight:700}
  .chips{display:flex;gap:9px;overflow-x:auto;padding:14px 20px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:var(--ink);font-size:13px;font-weight:600;padding:9px 15px;border-radius:100px;cursor:pointer;transition:.15s;white-space:nowrap}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.near{border-color:var(--violet);color:var(--violet)}.chip.near.on{background:var(--violet);color:#fff}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;padding:20px 20px 12px}
  .sec-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.01em}
  .sec-link{font-size:13px;font-weight:600;color:var(--violet)}
  .spotlight-scroll{display:flex;gap:14px;overflow-x:auto;padding:0 20px 6px;scrollbar-width:none}.spotlight-scroll::-webkit-scrollbar{display:none}
  .spot{flex:none;width:255px;border-radius:22px;padding:20px;position:relative;overflow:hidden;color:#fff;cursor:pointer;background:var(--violet)}
  .spot::before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,176,32,.55),transparent 70%);top:-60px;right:-40px}
  .spot .tag{position:relative;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;background:rgba(255,255,255,.16);display:inline-block;padding:5px 10px;border-radius:100px;margin-bottom:44px}
  .spot .who{position:relative;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px;line-height:1.1;margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .spot .what{position:relative;font-size:13px;opacity:.85;line-height:1.4}.spot .price{position:relative;margin-top:14px;font-weight:700;font-size:14px}
  .list{padding:4px 20px 8px;display:flex;flex-direction:column;gap:12px}
  .card{display:flex;gap:14px;background:rgba(255,255,255,.80);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(231,224,214,.9);border-radius:18px;padding:14px;cursor:pointer;transition:transform .15s,border-color .15s;box-shadow:var(--shadow);animation:rise .5s ease backwards}
  .card:active{transform:scale(.99)}
  .avatar{flex:none;width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px;color:#fff;background-size:cover;background-position:center}
  .card .body{flex:1;min-width:0}
  .card .name{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;line-height:1.15;margin-bottom:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .card .offer{font-size:13.5px;color:var(--mist);line-height:1.35;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .metarow{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;flex-wrap:wrap}
  .catbadge{color:var(--violet);background:var(--violet-soft);padding:3px 9px;border-radius:100px;font-size:11.5px}
  .rating{display:flex;align-items:center;gap:3px}.dist{color:var(--mist);display:inline-flex;align-items:center;gap:3px}.pricetag{margin-left:auto;font-weight:700}
  .verif{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--violet);flex:none}.verif svg{width:9px;height:9px;stroke:#fff;stroke-width:3}
  .spot .verif{background:rgba(255,255,255,.9)}.spot .verif svg{stroke:var(--violet)}
  .licpill{font-size:10.5px;font-weight:700;color:var(--green);background:#E7F7F0;padding:2px 8px;border-radius:100px}
  .foodpill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px}.foodpill.baked{color:var(--green);background:#E7F7F0}.foodpill.prep{color:#a5600f;background:#FFF0E0}
  .empty{text-align:center;color:var(--mist);font-size:14px;padding:40px 30px;line-height:1.5}
  .feed{padding:8px 20px 8px;display:flex;flex-direction:column;gap:14px}
  .post{background:rgba(255,255,255,.80);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(231,224,214,.9);border-radius:18px;padding:15px;box-shadow:var(--shadow);animation:rise .5s ease backwards}
  .p-head{display:flex;align-items:center;gap:11px;margin-bottom:11px}
  .p-av{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:'Bricolage Grotesque',sans-serif;background-size:cover}
  .p-name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:5px}.p-when{font-size:12px;color:var(--mist)}
  .p-promo{font-size:11px;font-weight:700;color:#a5600f;background:#FFF0E0;padding:3px 9px;border-radius:100px;margin-left:auto}
  .p-text{font-size:14.5px;line-height:1.45;color:#2c2438;margin-bottom:12px}
  .p-actions{display:flex;gap:20px;border-top:1px solid var(--line);padding-top:11px}
  .p-act{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--mist);cursor:pointer}
  .p-act.liked{color:var(--rose)}
  .p-cbox{margin-top:11px;display:flex;gap:8px}
  .p-cbox input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:13.5px;outline:0;background:#fff}
  .p-cbox button{border:0;background:var(--violet);color:#fff;border-radius:10px;padding:0 14px;font-weight:700;font-family:inherit;cursor:pointer}
  .p-comment{font-size:13px;margin-top:9px;line-height:1.4}.p-comment b{font-weight:700}
  .detail-hero{background:var(--paper)}
  .store-banner{padding:34px 20px 18px;color:#fff;position:relative;overflow:hidden}
  .store-banner::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);top:-70px;right:-50px}
  .backbtn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#fff;cursor:pointer;padding:0 0 14px;position:relative}
  .welcome{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85;position:relative;display:flex;align-items:center;gap:6px}
  .store-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:27px;letter-spacing:-.01em;line-height:1.1;margin:5px 0 3px;position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .store-sub{font-size:13.5px;opacity:.9;position:relative;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .detail-av{width:70px;height:70px;border-radius:20px;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:28px;color:#fff;background-size:cover;background-position:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .store-row{display:flex;gap:14px;align-items:center;position:relative;margin-bottom:4px}
  .socialrow{display:flex;gap:9px;padding:16px 20px 0}
  .soc{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
  .statrow{display:flex;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);margin:16px 20px 4px}
  .stat{flex:1;padding:14px 8px;text-align:center;border-right:1px solid var(--line)}.stat:last-child{border-right:0}
  .stat .n{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px}.stat .l{font-size:11px;color:var(--mist);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
  .detail-body{padding:0 20px}
  .block-t{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15px;margin:20px 0 8px}
  .block-p{font-size:14.5px;color:#40384c;line-height:1.55}
  .gallery{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;cursor:pointer}
  .gadd{aspect-ratio:1;border:1.5px dashed #c9c1b4;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--mist);cursor:pointer;background:rgba(255,255,255,.5)}
  .svc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:8px}.svc .p{font-weight:700}
  .paychips{display:flex;flex-wrap:wrap;gap:7px}.paych{font-size:12px;font-weight:600;background:var(--violet-soft);color:#3f2b8c;padding:6px 11px;border-radius:100px}
  .paynote{display:flex;align-items:center;gap:8px;background:#E7F7F0;color:#0b7a54;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:600;margin-top:12px}
  .cta-bar{position:absolute;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;z-index:30}
  .btn{flex:1;border:0;border-radius:14px;padding:15px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:.15s}
  .btn-primary{background:var(--violet);color:#fff}.btn-primary:active{transform:scale(.98)}
  .btn-ghost{flex:none;width:54px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .book-wrap{padding:6px 20px 20px}
  .book-h{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;margin:6px 0 16px}
  .opt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;transition:.15s}
  .opt.on{border-color:var(--violet);background:var(--violet-soft)}
  .book-lbl{font-size:13px;font-weight:700;margin:16px 0 9px}
  .pillrow{display:flex;flex-wrap:wrap;gap:8px}
  .tpick{border:1px solid var(--line);background:var(--card);border-radius:100px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer}.tpick.on{background:var(--violet);color:#fff;border-color:var(--violet)}
  .sms{background:#0b1220;color:#dfe7f5;border-radius:16px;padding:16px;font-size:13px;line-height:1.5;margin:8px 0 4px;box-shadow:var(--shadow)}
  .sms .sms-h{color:#7fe3b0;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}.sms b{color:#fff}
  .learn-hero{padding:6px 20px 0}.learn-h{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.01em;line-height:1.15;margin:4px 0 4px}
  .learn-sub{font-size:14px;color:var(--mist);line-height:1.5;margin-bottom:14px}
  .disc{display:flex;gap:9px;align-items:flex-start;background:#FFF6E6;border:1px solid #F5E2BC;color:#7a5b16;border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.4;margin:0 20px 14px}
  .learn-list{padding:0 20px;display:flex;flex-direction:column;gap:11px}
  .lcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;cursor:pointer;box-shadow:var(--shadow);animation:rise .5s ease backwards}
  .lc-top{display:flex;align-items:center;gap:12px}
  .lc-ic{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--violet-soft);color:var(--violet)}
  .lc-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15.5px;flex:1}
  .lc-desc{font-size:13px;color:var(--mist);line-height:1.45;margin-top:9px}
  .lc-src{font-size:11.5px;font-weight:600;color:var(--violet);margin-top:8px;display:inline-flex;align-items:center;gap:4px}
  .form-wrap{padding:6px 20px 20px}
  .form-h{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.01em;margin:6px 0 4px}
  .form-sub{font-size:14px;color:var(--mist);line-height:1.5;margin-bottom:18px}
  .photo-up{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .photo-av{width:70px;height:70px;border-radius:20px;background:var(--violet-soft);color:var(--violet);display:flex;align-items:center;justify-content:center;cursor:pointer;background-size:cover;background-position:center;position:relative;flex:none}
  .photo-av .cam{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--paper)}
  .field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
  .field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;font-family:inherit;font-size:15px;color:var(--ink);outline:0}
  .field input:focus,.field textarea:focus{border-color:var(--violet)}.field textarea{resize:none;min-height:80px;line-height:1.4}
  .catgrid{display:flex;flex-wrap:wrap;gap:8px}
  .catpick{border:1px solid var(--line);background:var(--card);border-radius:100px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}.catpick.on{background:var(--violet);color:#fff;border-color:var(--violet)}
  .edu-row{display:flex;gap:8px}.edu-row input{flex:1}
  .verify-btn{flex:none;border:0;border-radius:12px;padding:0 16px;font-family:inherit;font-weight:700;font-size:14px;background:var(--ink);color:#fff;cursor:pointer}
  .edu-ok{display:flex;align-items:center;gap:8px;background:#E7F7F0;border:1px solid #B6E6D3;color:#0b7a54;border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:600}
  .attest{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;cursor:pointer}.attest.lic{background:#F3FBF7;border-color:#CDEBDD}
  .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;transition:.15s;margin-top:1px}
  .box svg{width:12px;height:12px;stroke:#fff;stroke-width:3;opacity:0}.attest.on .box{background:var(--violet);border-color:var(--violet)}.attest.on .box svg{opacity:1}
  .attest span{font-size:12.5px;line-height:1.4;color:#40384c}
  .sublock{display:flex;gap:10px;align-items:center;background:var(--violet-soft);border-radius:12px;padding:13px 14px;font-size:12.5px;line-height:1.4;color:#3f2b8c;margin:4px 0 14px}
  .submit{width:100%;background:var(--ink);color:#fff;border:0;border-radius:14px;padding:16px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;margin-top:6px;transition:.15s}.submit:disabled{background:#D8D2CA;color:#fff;cursor:not-allowed}
  .done{text-align:center;padding:48px 30px}
  .done .mark{width:74px;height:74px;border-radius:50%;background:var(--violet-soft);color:var(--violet);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:pop .55s cubic-bezier(.2,.8,.3,1.3)}
  .done h3{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;margin-bottom:8px}.done p{color:var(--mist);font-size:14px;line-height:1.55;margin-bottom:22px}
  .plan{margin:6px 0 16px;border-radius:20px;padding:20px;color:#fff;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(90,43,224,.28)}
  .plan::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);top:-70px;right:-40px;pointer-events:none}
  .plan .p-lbl{font-size:12px;font-weight:600;opacity:.75;text-transform:uppercase;letter-spacing:.05em}.plan .p-big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;margin:4px 0 3px}.plan .p-sub{font-size:12.5px;opacity:.85}
  .cust{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}

   Everyone else / testers   -> demo access only; never counted as a real user,
                                founder, vendor or storefront. */
function isCEOEmail(e){return /@integroservicegroup\.com$/i.test(String(e||'').trim());}
function isEduEmail(e){return /\.edu$/i.test(String(e||'').trim());}
function applyAccount(email){
  state.acctEmail=email||'';
  state.isCEO=isCEOEmail(email);
  state.isRealStudent=isEduEmail(email);
  state.tester=false;
  if(state.isCEO){state.isFounder=false;}
  if(state.isRealStudent||state.isCEO)creditReferral();
  loadReferrals();syncReferralsFromServer();syncServerStats();
  var cc=campusByDomain(email||'');if(cc)state.campus=cc;
  if(typeof refreshDemo==='function')refreshDemo();
}

/* ===== Referrals & founder spots (10 per school, 3 vendor referrals = founder) ===== */
function myRefCode(){var e=String(state.acctEmail||'').toLowerCase();var s=(e.split('@')[0]||'').replace(/[^a-z0-9]/g,'');return (s||'vendu').slice(0,14);}
function myRefLink(){try{return location.origin+location.pathname+'?ref='+myRefCode();}catch(e){return 'vendu.app/join?ref='+myRefCode();}}
function founderNumber(){if(state.founderNum)return state.founderNum;var n=0;try{n=parseInt(localStorage.getItem('vendu_founder_num')||'0',10)||0;}catch(e){}if(!n){n=Math.min(FOUNDER_CAP,FOUNDERS);try{localStorage.setItem('vendu_founder_num',String(n));}catch(e){}}state.founderNum=n;return n;}
function founderCongrats(){var host=document.querySelector('.device')||document.body;if(document.getElementById('fcong'))return;var w=document.createElement('div');w.id='fcong';w.style.cssText='position:absolute;inset:0;background:rgba(20,12,40,.55);display:flex;align-items:center;justify-content:center;z-index:80;padding:24px';w.innerHTML='<div style="background:var(--card,#fff);border-radius:20px;padding:24px 20px;text-align:center;max-width:300px;box-shadow:0 20px 50px rgba(0,0,0,.3)">'+'<div style="font-size:40px">\uD83C\uDF93</div><div style="font-family:Bricolage Grotesque;font-weight:800;font-size:20px;margin-top:6px">You\u2019re a Founder!</div>'+'<div style="font-size:13.5px;color:var(--mist,#777);line-height:1.5;margin:8px 0 16px">Three vendors signed up with your link, so you claimed <b>Founder #'+founderNumber()+' of '+FOUNDER_CAP+'</b> at '+CAMP()+'. Your \uD83C\uDF93 Founder badge now shows everywhere you post, plus a monthly Boost.</div>'+'<button id="fcongok" class="submit" style="margin:0">Nice!</button></div>';host.appendChild(w);document.getElementById('fcongok').onclick=function(){w.remove();try{render();}catch(e){}};}
function syncFounder(){var was=state.isFounder;state.isFounder=!state.isCEO&&state.referrals>=FOUNDER_GOAL;if(state.isFounder&&!was){founderNumber();var seen=false;try{seen=!!localStorage.getItem('vendu_founder_congrats');localStorage.setItem('vendu_founder_congrats','1');}catch(e){}if(!seen)setTimeout(founderCongrats,400);}}
function loadReferrals(){try{state.referrals=parseInt(localStorage.getItem('vendu_refs_'+myRefCode())||'0',10)||0;}catch(e){state.referrals=0;}syncFounder();}
function creditReferral(){try{var r=localStorage.getItem('vendu_ref_from');if(!r||localStorage.getItem('vendu_ref_done'))return;if(r===myRefCode())return;localStorage.setItem('vendu_ref_done','1');try{if(window.VendU&&VendU.recordReferral)VendU.recordReferral(r,(state.campus&&state.campus.name)||'',BUILD);}catch(e){}var k='vendu_refs_'+r;localStorage.setItem(k,String((parseInt(localStorage.getItem(k)||'0',10)||0)+1));}catch(e){}}
/* Keep referrals, ratings and jobs-done in sync with the shared backend so they
   follow the student across devices. */
function syncReferralsFromServer(){try{if(!window.VendU||!VendU.referralCount||!state.isRealStudent&&!state.isCEO)return;VendU.referralCount(myRefCode(),BUILD).then(function(r){if(r&&r.ok&&typeof r.referrals==='number'){state.referrals=r.referrals;try{localStorage.setItem('vendu_refs_'+myRefCode(),String(r.referrals));}catch(e){}syncFounder();try{render();}catch(e){}}});}catch(e){}}
function syncServerStats(){try{if(!window.VendU||!VendU.vendorStats)return;var ids=HUSTLES.filter(function(h){return !h.me;}).map(function(h){return h.id;});if(!ids.length)return;VendU.vendorStats(ids,BUILD).then(function(r){if(!r||!r.ok||!r.stats)return;var changed=false;Object.keys(r.stats).forEach(function(id){var st=r.stats[id];var h=HUSTLES.find(function(x){return x.id===id;});if(!h||!st)return;if(st.jobs){h.jobs=(parseInt(h.jobs,10)||0)+st.jobs;changed=true;}if(st.avg){h.rating=st.avg;h.reviews=(parseInt(h.reviews,10)||0)+st.reviews;changed=true;}});if(changed){try{render();}catch(e){}}});}catch(e){}}
try{var _rp=new URL(location.href).searchParams.get('ref');if(_rp)localStorage.setItem('vendu_ref_from',_rp);}catch(e){}
function accountBadge(){return state.isCEO?'<span class="ceopill">\u2605 CEO</span>':(state.isFounder&&state.isRealStudent?'<span class="founderpill">\u{1F393} Founder</span>':'');}
function doLogout(){try{VendU.signOut();}catch(e){}try{localStorage.removeItem('vendu_return_build');}catch(e){}location.reload();}

function founderBanner(){if(FOUNDERS>=FOUNDER_CAP)return '';const left=FOUNDER_CAP-FOUNDERS;return `<div class="founder"><span class="em">🎓</span><div>Only <b>${left} founder spot${left>1?'s':''}</b> left at ${CAMP()}.</div></div>`;}

  const posts=FEED.filter(p=>{const h=HUSTLES.find(x=>x.id===p.s);return h&&h.campus===state.campus.id&&(!q||(h.name+p.text).toLowerCase().includes(q))});
  return founderBanner()+`<div class="feed">${posts.map((p,i)=>{const h=HUSTLES.find(x=>x.id===p.s);const open=state.openC===p.id;return `
    <div class="post" style="animation-delay:${i*40}ms">
      <div class="p-head"><div class="p-av" data-open="${h.id}" style="background:${bg(h)}">${h.init}</div>
        <div><div class="p-name" data-open="${h.id}">${h.name}${h.v?CHECK:''}${vendorPills(h,p.text||p.body||'')}</div><div class="p-when">${p.when} · ${h.cat}</div></div>
        ${p.promo?`<span class="p-promo">${p.promo}</span>`:''}</div>
      <div class="p-text">${p.text}</div>
      <div class="p-actions"><div class="p-act ${p.liked?'liked':''}" data-like="${p.id}">${heart(p.liked)} ${p.likes}</div>

      ${open?`${p.comments.map(c=>`<div class="p-comment"><b class="gp-author" data-user="${c[0]}␟${c[0].charAt(0)}␟0" style="cursor:pointer">${c[0]}</b> ${c[1]}</div>`).join('')}<div class="p-cbox"><input id="ci${p.id}" placeholder="Add a comment…"><button data-send="${p.id}">Post</button></div>`:''}
    </div>`}).join('')}</div>`;
}

function browseBody(){
  let f=HUSTLES.filter(h=>h.campus===state.campus.id&&(state.cat==='All'||h.cat===state.cat)&&(state.q===''||(h.name+h.offer+h.cat).toLowerCase().includes(state.q.toLowerCase())));
  if(state.avail)f=f.filter(h=>AVAIL.includes(h.id));
  if(state.cheap)f=f.filter(h=>firstNum(h.price)<=25);
  if(state.near)f=[...f].sort((a,b)=>a.dist-b.dist);
  if(state.top)f=[...f].sort((a,b)=>parseFloat(b.rating)-parseFloat(a.rating));
  f=[...f].sort((a,b)=>(b.boost||0)-(a.boost||0));
  const feat=HUSTLES.filter(h=>h.campus===state.campus.id&&['5.0','4.9'].includes(h.rating)).slice(0,5);
  const clean=!(state.near||state.avail||state.cheap||state.top)&&state.cat==='All'&&state.q==='';
  return `<div class="chips"><div class="chip near ${state.near?'on':''}" id="nearchip">${pin} Near me</div>${CATS.map(c=>`<div class="chip ${c===state.cat?'on':''}" data-cat="${c}">${c}</div>`).join('')}</div>
    <div class="chips" style="padding-top:8px"><div class="chip ${state.avail?'on':''}" data-f="avail">🟢 Available now</div><div class="chip ${state.cheap?'on':''}" data-f="cheap">Under $25</div><div class="chip ${state.top?'on':''}" data-f="top">★ Top rated</div></div>
    ${clean?`<div class="sec-head"><div class="sec-title">🔥 Featured on campus</div></div><div class="spotlight-scroll">${feat.map(h=>`<div class="spot" data-open="${h.id}" style="background:${bg(h)}"><span class="tag">${h.cat}</span><div class="who">${h.name}${h.v?CHECK:''}</div><div class="what">${h.offer.split('.')[0]}.</div><div class="price">${h.price}</div></div>`).join('')}</div>`:''}
    <div class="sec-head"><div class="sec-title">${state.near?'Nearest you':state.top?'Top rated':state.cat==='All'?'All hustles':state.cat}</div><div class="sec-link">${f.length} found</div></div>
    <div class="list">${clean?sponsoredCard():''}${f.length?f.map((h,i)=>`<div class="card" data-open="${h.id}" style="animation-delay:${i*40}ms"><div class="avatar" style="background:${bg(h)}">${h.init}</div><div class="body"><div class="name">${h.name}${h.v?CHECK:''}${vendorPills(h)}${h.boost?'<span class="boostpill">⚡ Boosted</span>':''}${AVAIL.includes(h.id)?'<span class="availpill">● now</span>':''}${pillFor(h)}</div><div class="offer">${h.offer}</div><div class="metarow"><span class="catbadge">${h.cat}</span><span class="rating">${star} ${h.rating}</span><span class="dist">${pin} ${h.dist} mi</span><span class="pricetag">${h.price}</span></div></div></div>`).join(''):`<div class="empty">No hustles match those filters yet.</div>`}</div>`;
}

function eventsBody(){
  const cal='<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>';
  const now=Date.now();
  const seed=EVENTS_SEED.map(e=>{const d=new Date();d.setHours(e.hour,0,0,0);d.setDate(d.getDate()+e.inDays);return Object.assign({},e,{ts:d.getTime()});});
  const all=[...state.events,...seed].filter(e=>e.campus===state.campus.id&&e.ts>now-3*3600*1000).sort((a,b)=>a.ts-b.ts);
  if(!all.length)return `<div class="empty" style="padding-top:50px">No upcoming events right now.<br>Tap the ＋ to post one.</div>`;
  return `<div class="events">${all.map((e,i)=>{const cc=(e.c!=null?e.c:0);return `<div class="eflyer" style="${e.img?'':'background:'+bannerGrad(color(cc))};animation-delay:${i*40}ms">${e.img?`<img src="${e.img}">`:''}${e.tag?`<span class="etag">${e.tag}</span>`:''}<div class="eover"><div class="etitle">${e.title}</div><div class="emeta">${icon(cal,13)} ${fmtDate(e.ts)}</div><div class="emeta">${pin} ${e.loc}</div><div style="display:flex;gap:8px;margin-top:11px"><button class="eint" data-int="${i}">Interested</button><a class="eint" style="text-decoration:none" href="${mapsUrl(e.loc)}" target="_blank" rel="noopener">${icon('<path d="M9 20l-6-2V4l6 2 6-2 6 2v14l-6-2-6 2zM9 6v14M15 4v14"/>',13)} Directions</a></div></div></div>`;}).join('')}</div>`;
}

function wireHome(){
  screen.querySelectorAll('.chips').forEach(function(el,i){conveyorHint(el,'homechips'+i);});
  const q=document.getElementById('q');if(q)q.oninput=e=>{state.q=e.target.value;const s=screen.scrollTop;document.getElementById('homebody').innerHTML=state.home==='feed'?feedBody():state.home==='browse'?browseBody():eventsBody();wireHome();screen.scrollTop=s;};
  wireLogo();
  
  screen.querySelectorAll('[data-home]').forEach(el=>el.onclick=()=>{state.home=el.dataset.home;state.q='';home();screen.scrollTop=0;});
  const nc=document.getElementById('nearchip');if(nc)nc.onclick=toggleNear;
  screen.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{state.cat=el.dataset.cat;document.getElementById('homebody').innerHTML=browseBody();wireHome();});
  screen.querySelectorAll('[data-f]').forEach(el=>el.onclick=()=>{state[el.dataset.f]=!state[el.dataset.f];document.getElementById('homebody').innerHTML=browseBody();wireHome();});
  screen.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openDetail(+el.dataset.open));
  screen.querySelectorAll('[data-sponsor]').forEach(el=>el.onclick=()=>toast('Sponsored — local businesses pay to reach students, which keeps VendU free.'));
  screen.querySelectorAll('[data-user]').forEach(function(el){el.onclick=function(){var p=el.dataset.user.split('␟');openUser(p[0],p[1],+p[2]);};});
  screen.querySelectorAll('[data-like]').forEach(el=>el.onclick=()=>{const p=FEED.find(x=>x.id==el.dataset.like);p.liked=!p.liked;p.likes+=p.liked?1:-1;refreshFeed();});
  screen.querySelectorAll('[data-cmt]').forEach(el=>el.onclick=()=>{const id=+el.dataset.cmt;state.openC=state.openC===id?0:id;refreshFeed();setTimeout(()=>{const i=document.getElementById('ci'+id);if(i)i.focus();},30);});
  screen.querySelectorAll('[data-send]').forEach(el=>el.onclick=()=>{const id=+el.dataset.send;const i=document.getElementById('ci'+id);if(i&&i.value.trim()){FEED.find(x=>x.id===id).comments.push(['You',i.value.trim()]);refreshFeed();setTimeout(()=>{const n=document.getElementById('ci'+id);if(n)n.focus();},20);}});
  screen.querySelectorAll('[data-int]').forEach(el=>el.onclick=()=>toast('Marked interested! (prototype)'));
}

function notifyBooking(h,b){
  try{
    var when=b.date+' \u00b7 '+b.time;
    var th=(state.inbox||[]).filter(function(t){return t.name===h.name;})[0];
    if(!th){th={id:'th'+(idc++),name:h.name,init:(h.name.trim()[0]||'?').toUpperCase(),color:'#5A2BE0',unread:0,msgs:[]};state.inbox.unshift(th);}
    th.msgs.push(['You','\uD83D\uDCC5 Booking request: '+b.svc+' \u2014 '+when]);
    th.msgs.push([h.name,'Confirmed! '+b.svc+' on '+when+'. You\u2019ll get a reminder 1 hour before \u23F0']);
    th.unread=(th.unread||0)+1;
    if(window.VendU&&VendU.notifyAppointment)VendU.notifyAppointment({vendor:h.name,vendorId:h.id,service:b.svc,when:when,phone:state.phone||'',build:BUILD});
  }catch(e){}
}

    <div class="field"><label>Location</label><input id="f4" placeholder="e.g. The Yard"></div>`;}
  screen.innerHTML=`<div class="topbar"><div class="brandrow"><div class="wordmark">Post</div>${back}</div></div>
    <div class="form-wrap enter"><div class="form-h">${title}</div>${body}<button class="submit" id="postmini">Post it</button></div>`;
  document.getElementById('tochooser').onclick=()=>{state.addMode=null;state.newPhoto=null;render();};
  const up=screen.querySelector('.up2');if(up)up.onclick=()=>cphoto.click();
  let tag=mode==='item'?'Sell':(mode==='request'?'0':'');
  screen.querySelectorAll('[data-tag]').forEach(el=>el.onclick=()=>{screen.querySelectorAll('[data-tag]').forEach(x=>x.classList.remove('on'));el.classList.add('on');tag=el.dataset.tag;});

    const v=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
    const rc=()=>Math.floor(Math.random()*12);
    if(mode==='item'){GOODS.unshift({name:v('f1')||'New item',price:v('f2')||'$—',tag:tag,img:state.newPhoto,emoji:'📦',c:rc(),by:(state.vname||'You'),bi:((state.vname||'Y').trim()[0]||'Y').toUpperCase(),bc:0,uc:state.themeColor,mine:true,id:'mp'+(idc++),campus:state.campus.id});state.tab='market';state.mkt='goods';}
    else if(mode==='request'){REQUESTS.unshift({img:state.newPhoto,who:(state.vname||'You'),in:((state.vname||'Y').trim()[0]||'Y').toUpperCase(),c:rc(),uc:state.themeColor,mine:true,id:'mp'+(idc++),barter:tag==='1'?1:0,txt:v('f1')||'New request',campus:state.campus.id});state.tab='market';state.mkt='requests';}
    else{let ts=Date.now()+2*86400000;const d=v('f2'),t=v('f3');if(d){const p=new Date(d+'T'+(t||'12:00')).getTime();if(!isNaN(p))ts=p;}state.events.unshift({title:v('f1')||'New event',loc:v('f4')||'Campus',ts:ts,img:state.newPhoto,tag:'New',c:rc(),mine:true,id:'mp'+(idc++),by:(state.vname||'You'),campus:state.campus.id});state.tab='home';state.home='events';}
    state.addMode=null;state.newPhoto=null;render();toast('Posted to VendU! 🎉');
  };
}

function mpRow(emoji,title,meta,type,id,img,sold){return '<div class="mprow"'+(sold?' style="opacity:.6"':'')+'>'+'<div class="mpic">'+(img?'<img src="'+img+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px">':emoji)+'</div>'+'<div class="mpbody"><div class="mptitle">'+title+(sold?' \u00b7 SOLD':'')+'</div><div class="mpmeta">'+meta+'</div>'+'<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">'+'<button class="mpdel" data-photopost="'+id+'" data-ptype="'+type+'">\uD83D\uDCF7 '+(img?'Change photo':'Add photo')+'</button>'+(type==='item'?'<button class="mpdel" data-soldpost="'+id+'">'+(sold?'\u21ba Mark available':'\u2713 Mark as sold')+'</button>':'')+'</div></div>'+'<button class="mpdel" data-delpost="'+id+'" data-ptype="'+type+'">Delete</button></div>';}
function myPostsScreen(){
  var items=GOODS.filter(function(g){return g.mine;}),reqs=REQUESTS.filter(function(r){return r.mine;}),evs=(state.events||[]).filter(function(e){return e.mine;});
  var total=items.length+reqs.length+evs.length;
  var h='<div class="topbar"><div class="brandrow"><div class="wordmark">My posts</div><div class="locpill" id="mpBack" style="cursor:pointer">\u2715 Close</div></div></div><div class="enter" style="padding:10px 0 20px">';
  if(!total){h+='<div class="empty" style="padding:44px 30px">You haven\u2019t posted anything yet.<br>Tap the \uFF0B to sell an item, post a request, or add an event.</div>';}
  else{
    if(items.length){h+='<div class="sec-h">Items ('+items.length+')</div>'+items.map(function(g){return mpRow(g.emoji||'📦',g.name,g.price+' \u00b7 '+g.tag,'item',g.id,g.img,g.sold);}).join('');}
    if(reqs.length){h+='<div class="sec-h">Requests ('+reqs.length+')</div>'+reqs.map(function(r){return mpRow('🙋',r.txt,r.barter?'Barter':'Looking for','request',r.id,r.img,false);}).join('');}
    if(evs.length){h+='<div class="sec-h">Events ('+evs.length+')</div>'+evs.map(function(e){return mpRow('🎉',e.title,e.loc||'Campus','event',e.id,e.img,false);}).join('');}
  }
  h+='</div>';
  screen.innerHTML=h;
  document.getElementById('mpBack').onclick=function(){state.myPostsView=false;render();};
  screen.querySelectorAll('[data-delpost]').forEach(function(el){el.onclick=function(){var t=el.dataset.ptype,id=el.dataset.delpost;
    if(t==='item'){var i=GOODS.findIndex(function(g){return String(g.id)===id;});if(i>-1)GOODS.splice(i,1);}
    else if(t==='request'){var i=REQUESTS.findIndex(function(r){return String(r.id)===id;});if(i>-1)REQUESTS.splice(i,1);}
    else{var i=state.events.findIndex(function(e){return String(e.id)===id;});if(i>-1)state.events.splice(i,1);}
    toast('Post removed');myPostsScreen();};});
  screen.querySelectorAll('[data-soldpost]').forEach(function(el){el.onclick=function(){var g=GOODS.filter(function(x){return String(x.id)===el.dataset.soldpost;})[0];if(g){g.sold=!g.sold;toast(g.sold?'Marked as sold \u2713':'Back on the market');myPostsScreen();}};});
  screen.querySelectorAll('[data-photopost]').forEach(function(el){el.onclick=function(){state.photoTarget={id:el.dataset.photopost,type:el.dataset.ptype};cphoto.value='';cphoto.click();};});
}

var _hinted={};
function conveyorHint(el,key){
  if(!el||_hinted[key]||typeof requestAnimationFrame==='undefined')return;
  var stopped=false,dir=1,cycles=0,raf=null;
  function stop(){stopped=true;if(raf)cancelAnimationFrame(raf);}
  function step(){
    if(stopped||!el.isConnected){return;}
    var max=el.scrollWidth-el.clientWidth;
    if(max<=6){stop();return;}
    el.scrollLeft+=dir*1.2;
    if(el.scrollLeft>=max-1)dir=-1;
    if(el.scrollLeft<=1&&dir===-1){dir=1;cycles++;if(cycles>=2){stop();return;}}
    raf=requestAnimationFrame(step);
  }
  setTimeout(function(){
    if(!el.isConnected||el.scrollWidth-el.clientWidth<=6)return;
    _hinted[key]=true;
    ['touchstart','pointerdown','wheel','mousedown'].forEach(function(ev){el.addEventListener(ev,stop,{passive:true});});
    raf=requestAnimationFrame(step);
  },450);
}

  var em='';try{var s=window.VendU&&VendU.student&&VendU.student();em=(s&&s.email)||'';}catch(e){}
  fetch('/api/public/account/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,build:BUILD})}).catch(function(){});
